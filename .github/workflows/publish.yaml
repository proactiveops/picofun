name: Publish

on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  release:
    name: Cut a Release

    runs-on: ubuntu-24.04

    environment: release

    permissions:
      contents: write # needed for creating the release
      id-token: write

    steps:
    - name: Checkout
      id: checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Install uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        activate-environment: true
        enable-cache: false

    - name: Set up Python
      run: uv python install

    - name: Build
      id: build
      run: |
        uv sync --group=build
        uv run -m build
        twine check --strict dist/*

    - name: Publish on PyPI
      id: publish
      uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

    - name: Set Tag
      id: set-tag
      run: |
        echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

    - name: Create release
      id: create-release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        tag: ${{ env.tag }}
      run: |
        gh release create "$tag" \
            --title="PicoFun ${tag}" \
            --generate-notes

    - name: Upload Assets
      id: upload-assets
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        tag: ${{ env.tag }}
      run: |
        gh release upload $tag dist/*.whl dist/*.tar.gz
